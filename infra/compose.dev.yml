# Development services for this monorepo, following the shared ../infra pattern (one Postgres 17, one database
# and role pair per app). Start and reset with `pnpm run up` and `pnpm run up:fresh` (scripts/stack.ts).
# Every value here is a DEV default and public in the repository. Host ports sit below 49152 (Windows reserves
# shifting blocks above it for Hyper-V) and differ from Profile's (45432), so both stacks can run at once.
name: bodhchakra-dev

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kaamkoti
    ports:
      - "45442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP on purpose: during first start the entrypoint runs the init scripts on a socket-only server,
      # which a socket check would already call ready before the roles exist.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d kaamkoti"]
      interval: 1s
      timeout: 3s
      retries: 60
    networks: [default, internal]

  # The shared platform container (docs/architecture.md 1). Behind a profile so `pnpm run up` stays fast; build
  # and start it with `docker compose -f infra/compose.dev.yml --profile platform up -d --build platform`.
  # In production it has no host port and apps reach it on the internal network as http://platform:3000. Here
  # the port is bound to loopback only, so an app running on this machine can call it.
  platform:
    profiles: [platform]
    build:
      context: ..
      dockerfile: services/platform/Dockerfile
    environment:
      DATABASE_URL: postgres://platform_app:platform_app@postgres:5432/platform
      SERVICE_CLIENTS: '{"kaamkoti":"dev-only-kaamkoti-service-secret-public-in-repo"}'
      IDENTITY_ORIGIN: http://127.0.0.1:45443
      IDENTITY_SECRET: dev-only-identity-secret-public-in-repo-0123456789
      # Kaam Koti's callback and sign-out pages arrive with 0.6b; these are their dev addresses.
      SIGN_IN_CLIENTS: >-
        {"kaamkoti":{"secret":"dev-only-kaamkoti-sign-in-secret-public-in-repo",
        "redirectUris":["http://127.0.0.1:45450/auth/callback"],
        "postLogoutRedirectUris":["http://127.0.0.1:45450/"]}}
      REDIS_URL: redis://redis:6379
      SMTP_URL: smtp://mailpit:1025
      EMAIL_FROM: Bodhchakra <sign-in@localhost>
    ports:
      - "127.0.0.1:45443:3000"
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  # Rate-limit counters (docs/architecture.md 1), for platform and Kaam Koti; their key names do not overlap. Nothing in it must survive a restart: no volume.
  redis:
    image: redis:8
    ports:
      - "127.0.0.1:45444:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
    networks: [internal]

  # Object store for uploads (docs/architecture.md 10). `pnpm run up` gives the node a layout and creates the
  # bucket and the app's key (scripts/stack.ts). The S3 API on 45447 is the only port.
  garage:
    image: dxflrs/garage:v2.1.0
    ports:
      - "127.0.0.1:45447:3900"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [internal]

  # Catches every email in development: SMTP on 45445, the inbox at http://127.0.0.1:45446.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:45445:1025"
      - "127.0.0.1:45446:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [internal]

networks:
  # Joins apps, workers and platform. Postgres is on it too, under its service name.
  internal:

volumes:
  pgdata:
  garage-meta:
  garage-data:
